name: Update rv-index

# Keeps the RhythmVerse cache current: every hour, scans charts uploaded or changed since the
# last run (usually a handful), retries earlier failures, and once a week walks the whole list to
# drop deleted charts. The cache (rv-state.sqlite.zst) and the index for Truss
# (rv-index.json.zst) live on the `rv-index` release, so nothing is committed. Truss Index's
# "Deploy site" reads the cache from there.
on:
  schedule:
    - cron: "41 * * * *" # hourly
  workflow_dispatch:
    inputs:
      full:
        description: "Do the full pass (drop deleted charts) now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rv-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: rv-index
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --bin truss-scan

      - name: Get the cache
        id: state
        run: |
          mkdir -p state out
          # The cache is seeded from the local backfill. Never start from nothing: that would
          # replace the published cache with an empty one.
          gh release download "$RELEASE" --pattern rv-state.sqlite.zst --dir state
          zstd -d --rm -f state/rv-state.sqlite.zst -o state/rv-state.sqlite

      - name: Update
        run: |
          # Small newest-first pages (the full pass still reads 500 at a time), 2 songs at once,
          # and stop scanning after 45 minutes so hourly runs don't pile up.
          ./target/release/truss-scan update --page-size 50 --workers 2 --delay 3 --max-minutes 45 \
            ${{ github.event.inputs.full == 'true' && '--full' || '' }}
          ./target/release/truss-scan stats --hours 2 || true

      - name: Publish the index and cache
        # Also after a failed or timed-out update (every scanned chart is already saved), but
        # never when the cache couldn't be fetched.
        if: always() && steps.state.outcome == 'success'
        run: |
          test -f out/rv-index.json.zst || ./target/release/truss-scan export
          zstd -19 -f state/rv-state.sqlite -o state/rv-state.sqlite.zst
          gh release upload "$RELEASE" out/rv-index.json.zst state/rv-state.sqlite.zst --clobber
