name: Update rv-index

# Keeps the RhythmVerse cache current. One run lasts about 5.5 hours (GitHub's job limit is 6)
# and starts the next one itself, so it doesn't rely on GitHub's scheduler, which skips runs.
# Every 30 minutes it scans charts uploaded or changed since the last round (usually a handful),
# retries earlier failures that are due, and once a week walks the whole list to drop deleted
# charts; then it publishes the cache (rv-state.sqlite.zst) and the index for Truss
# (rv-index.json.zst) to the `rv-index` release, so nothing is committed. Truss Index's hourly
# "Deploy site" reads the cache from there.
#
# The schedule below is only a fallback that restarts the chain if it ever breaks; while a run is
# going, a scheduled one waits in the queue and is replaced by the next chained run.
on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Do the full pass (drop deleted charts) in the first round"
        type: boolean
        default: false

permissions:
  contents: write # the release, the keep-alive commit
  actions: write # start the next run

concurrency:
  group: rv-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: rv-index
    steps:
      - uses: actions/checkout@v4

      # GitHub turns off schedules in repos with no commits for 60 days.
      - name: Keep the fallback schedule active
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the fallback schedule active"
            git push
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --bin truss-scan

      - name: Get the cache
        run: |
          mkdir -p state out
          # The cache is seeded from the local backfill. Never start from nothing: that would
          # replace the published cache with an empty one.
          gh release download "$RELEASE" --pattern rv-state.sqlite.zst --dir state
          zstd -d --rm -f state/rv-state.sqlite.zst -o state/rv-state.sqlite

      - name: Watch
        shell: bash
        run: |
          # Keep going through a failed round (a RhythmVerse or GitHub hiccup); the next one retries.
          set +e
          bin=./target/release/truss-scan
          end=$(( $(date +%s) + 330 * 60 ))
          full="${{ github.event.inputs.full == 'true' && '--full' || '' }}"

          publish() {
            $bin export &&
            zstd -q -19 -f state/rv-state.sqlite -o state/rv-state.sqlite.zst &&
            gh release upload "$RELEASE" out/rv-index.json.zst state/rv-state.sqlite.zst --clobber
          }

          while :; do
            start=$(date +%s)
            left=$(( (end - start) / 60 ))
            [ $left -ge 5 ] || break
            budget=$(( left < 25 ? left : 25 ))
            # Small newest-first pages (the weekly full pass still reads 500 at a time) and 2
            # songs at once.
            $bin update --page-size 50 --workers 2 --delay 3 --max-minutes $budget $full | grep -v 'download limit'
            [ "${PIPESTATUS[0]}" = 0 ] || echo "update failed; trying again next round"
            full=""
            publish && echo "published at $(date -u +%H:%M)" || echo "publishing failed"
            next=$(( start + 30 * 60 ))
            [ $next -lt $end ] || break
            now=$(date +%s)
            [ $now -ge $next ] || sleep $(( next - now ))
          done

          gh workflow run update.yml && echo "started the next run"
